<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Drafter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', '"Segoe UI"', 'system-ui', 'sans-serif'] }
                }
            }
        };
        // Prevent theme flash on load
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
            background-image:
                radial-gradient(60rem 28rem at 50% -8%, rgba(99, 102, 241, 0.07), transparent 70%),
                radial-gradient(40rem 24rem at 85% 8%, rgba(56, 189, 248, 0.06), transparent 70%);
            background-attachment: fixed;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        html.dark body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(60rem 28rem at 50% -8%, rgba(99, 102, 241, 0.12), transparent 70%),
                radial-gradient(40rem 24rem at 85% 8%, rgba(56, 189, 248, 0.08), transparent 70%);
        }


        .editor-text {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            font-size: 19px;
            line-height: 2;
            letter-spacing: -0.005em;
            font-weight: 400;
            margin: 0;
            padding: 0;
            border: 0;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: normal;
            tab-size: 4;
        }

        #legal-text {
            display: block;
            width: 100%;
            position: relative;
            z-index: 2;                 
            background: transparent;   
            color: #1e293b;
            caret-color: #4f46e5;
            outline: none;
            resize: none;
            overflow: hidden;
        }
        #legal-text::placeholder { color: #cbd5e1; }
        #legal-text::selection { background: #e0e7ff; }

        html.dark #legal-text {
            color: #e2e8f0;
            caret-color: #818cf8;
        }
        html.dark #legal-text::placeholder { color: #475569; }
        html.dark #legal-text::selection { background: rgba(99, 102, 241, 0.3); }

        #ghost-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1;
            color: #94a3b8;
            pointer-events: none;
            user-select: none;
        }
        html.dark #ghost-text {
            color: #64748b;
        }

        .paper {
            box-shadow:
                0 0 0 1px rgba(15, 23, 42, 0.04),
                0 2px 4px rgba(15, 23, 42, 0.02),
                0 16px 40px -8px rgba(15, 23, 42, 0.08),
                0 48px 96px -24px rgba(15, 23, 42, 0.10);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        html.dark .paper {
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 16px 40px -8px rgba(0, 0, 0, 0.5),
                0 48px 96px -24px rgba(0, 0, 0, 0.7);
        }

        @keyframes live-ping {
            0%   { transform: scale(1);   opacity: .6; }
            75%, 100% { transform: scale(2.6); opacity: 0; }
        }
        .live-ping { animation: live-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

        @keyframes rise-in {
            from { opacity: 0; transform: translate(-50%, 8px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }
        .rise-in { animation: rise-in .6s .3s ease-out both; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800 dark:text-slate-100 antialiased">

    <!-- Glass header -->
    <header class="sticky top-0 z-20 bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl backdrop-saturate-150 border-b border-transparent dark:border-slate-800/60 transition-colors">
        <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-4 sm:px-6">
            <div class="flex min-w-0 items-center gap-3">
                <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-slate-800 to-slate-950 dark:from-indigo-500 dark:to-indigo-700 text-white shadow-sm">
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0L5 7z"/><path d="M19 7l-3 7a3.5 3.5 0 0 0 6 0l-3-7z"/></svg>
                </div>
                <h1 class="truncate text-[15px] font-semibold tracking-tight text-slate-900 dark:text-slate-100">Legal Drafter</h1>
            </div>

            <div class="flex items-center gap-2.5">
                <div id="live-pill" class="flex items-center gap-2 rounded-full bg-white/70 dark:bg-slate-800/80 px-3 py-1 text-xs font-medium text-slate-500 dark:text-slate-400 ring-1 ring-slate-900/5 dark:ring-white/10 transition-colors" role="status" aria-live="polite">
                    <span class="relative flex h-2 w-2">
                        <span id="live-ping" class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 live-ping hidden"></span>
                        <span id="live-dot" class="relative inline-flex h-2 w-2 rounded-full bg-slate-300 dark:bg-slate-600 transition-colors"></span>
                    </span>
                    <span id="live-label">Connecting…</span>
                </div>

                <!-- Theme Toggle Icon Button -->
                <button id="theme-toggle" type="button" aria-label="Toggle Light or Dark Theme" class="flex h-8 w-8 items-center justify-center rounded-full bg-white/70 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 ring-1 ring-slate-900/5 dark:ring-white/10 hover:bg-white dark:hover:bg-slate-800 transition-colors">
                    <!-- Sun icon (visible in dark mode) -->
                    <svg id="theme-icon-sun" class="hidden h-4 w-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                    <!-- Moon icon (visible in light mode) -->
                    <svg id="theme-icon-moon" class="h-4 w-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Drafting canvas -->
    <main class="px-3 pb-36 pt-8 sm:px-6 sm:pt-12">
        <div id="paper" class="paper mx-auto min-h-[297mm] w-full max-w-[210mm] cursor-text rounded-md bg-white dark:bg-slate-900 px-7 py-12 sm:px-16 sm:py-20 md:px-24 md:py-24">

            <p class="mb-10 select-none text-[11px] font-medium uppercase tracking-[0.18em] text-slate-300 dark:text-slate-600">Legal Drafter</p>

            <div class="relative">
                <div id="ghost-text" class="editor-text" aria-hidden="true"></div>
                <textarea
                    id="legal-text"
                    class="editor-text"
                    rows="1"
                    spellcheck="true"
                    placeholder="Start drafting your document... (e.g., 'The learned counsel for')"
                ></textarea>
            </div>
        </div>
    </main>

    <!-- Floating hint -->
    <div class="rise-in pointer-events-none fixed bottom-6 left-1/2 z-20 -translate-x-1/2">
        <div class="flex items-center gap-2 rounded-full bg-white/70 dark:bg-slate-800/80 px-3.5 py-1.5 text-xs text-slate-500 dark:text-slate-400 shadow-lg shadow-slate-900/5 ring-1 ring-slate-900/5 dark:ring-white/10 backdrop-blur-xl">
            <span>Press</span>
            <kbd class="rounded-md bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 font-sans text-[11px] font-semibold text-slate-700 dark:text-slate-200 ring-1 ring-slate-900/5 dark:ring-white/10">TAB</kbd>
            <span>to accept AI suggestions.</span>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
         const editor = document.getElementById("legal-text");
        const ghost = document.getElementById("ghost-text");
        let currentSuggestion = "";

        ws.onmessage = function(event) {
            currentSuggestion = event.data;
            if (currentSuggestion) {
                // Align the ghost text perfectly behind the real text
                ghost.textContent = editor.value + " " + currentSuggestion;
            } else {
                ghost.textContent = editor.value;
            }
        };

        editor.addEventListener("input", function() {
            ghost.textContent = editor.value; // Sync text immediately
            if (editor.value.trim().length > 0) {
                ws.send(editor.value);
            }
        });

        editor.addEventListener("keydown", function(event) {
            if (event.key === "Tab" && currentSuggestion) {
                event.preventDefault(); // Prevent changing focus
                editor.value += " " + currentSuggestion;
                ghost.textContent = editor.value;
                currentSuggestion = "";
                ws.send(editor.value); // Trigger next prediction
            }
        });

        // =====================================================================

        // Auto-expand: grow the textarea to fit its text, or the ghost text if that wraps further.
        function autoResize() {
            editor.style.height = "auto";
            editor.style.height = Math.max(editor.scrollHeight, ghost.scrollHeight) + "px";
        }
        // Every handler above updates the ghost via textContent, so watching it covers typing,
        // incoming predictions and Tab-accept without touching those handlers.
        new MutationObserver(autoResize).observe(ghost, { childList: true, characterData: true, subtree: true });
        editor.addEventListener("input", autoResize);
        window.addEventListener("resize", autoResize);

        // Live connection indicator
        const liveDot = document.getElementById("live-dot");
        const livePing = document.getElementById("live-ping");
        const liveLabel = document.getElementById("live-label");
        const livePill = document.getElementById("live-pill");

        function setLive(connected) {
            liveDot.classList.toggle("bg-emerald-500", connected);
            liveDot.classList.toggle("bg-rose-400", !connected);
            liveDot.classList.remove("bg-slate-300", "dark:bg-slate-600");
            livePing.classList.toggle("hidden", !connected);
            liveLabel.textContent = connected ? "Live AI Connection" : "Disconnected";
            livePill.classList.toggle("text-slate-500", !connected);
            livePill.classList.toggle("text-slate-700", connected);
            livePill.classList.toggle("dark:text-slate-200", connected);
        }
        ws.addEventListener("open", () => setLive(true));
        ws.addEventListener("close", () => setLive(false));
        ws.addEventListener("error", () => setLive(false));

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById("theme-toggle");
        const sunIcon = document.getElementById("theme-icon-sun");
        const moonIcon = document.getElementById("theme-icon-moon");

        function syncThemeIcons() {
            const isDark = document.documentElement.classList.contains("dark");
            sunIcon.classList.toggle("hidden", !isDark);
            moonIcon.classList.toggle("hidden", isDark);
        }

        syncThemeIcons();

        themeToggleBtn.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            syncThemeIcons();
        });

        // Click anywhere on the page to keep writing
        document.getElementById("paper").addEventListener("mousedown", function(e) {
            if (e.target !== editor) { e.preventDefault(); editor.focus(); }
        });

        autoResize();
        editor.focus();
    </script>
</body>
</html>
